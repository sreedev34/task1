apiVersion: v1
kind: Service
metadata:
  name: aws-topology-service
  namespace: production
  labels:
    app: aws-topology
spec:
  selector:
    app: aws-topology
  type: ClusterIP          # change to LoadBalancer or NodePort if needed
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

